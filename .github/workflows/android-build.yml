name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/tempmail/**'
      - '.github/workflows/android-build.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di $SDKMANAGER, unduh cmdline-tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -sS -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web untuk native
        run: |
          cd artifacts/tempmail
          pnpm build:android
        env:
          PORT: 3100
          BASE_PATH: ./
          VITE_API_BASE_URL: https://m.clipku.com/tempmail

      - name: Capacitor sync
        run: |
          cd artifacts/tempmail
          ./node_modules/.bin/cap sync android

      - name: Build debug APK
        run: |
          cd artifacts/tempmail/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tempmail-debug-apk
          path: artifacts/tempmail/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Lampirkan APK ke Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/tempmail/android/app/build/outputs/apk/debug/app-debug.apk
