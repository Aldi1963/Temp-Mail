<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TempMail — Email Sementara Gratis</title>
    <meta name="description" content="Buat alamat email sementara instan tanpa registrasi. Privasi terlindungi, gratis selamanya." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TempMail" />
    <link rel="apple-touch-icon" href="icon-192.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="TempMail — Email Sementara Gratis" />
    <meta property="og:description" content="Buat email sementara instan. Lindungi privasi Anda dari spam." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://m.clipku.com/tempmail/" />
    <meta property="og:image" content="https://m.clipku.com/tempmail/opengraph.jpg" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="TempMail" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TempMail — Email Sementara Gratis" />
    <meta name="twitter:description" content="Buat email sementara instan. Lindungi privasi Anda dari spam." />
    <meta name="twitter:image" content="https://m.clipku.com/tempmail/opengraph.jpg" />

    <!-- SEO -->
    <link rel="canonical" href="https://m.clipku.com/tempmail/" />
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    #app-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#ffffff;transition:opacity .35s ease}
    #app-splash.hide{opacity:0;pointer-events:none}
    #app-splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 30px rgba(6,182,212,.35)}
    #app-splash .app-splash-name{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:22px;font-weight:800;color:#0e7490;letter-spacing:-.02em}
    #app-splash .app-splash-bar{width:120px;height:4px;border-radius:99px;background:rgba(6,182,212,.15);overflow:hidden}
    #app-splash .app-splash-bar span{display:block;height:100%;width:40%;border-radius:99px;background:#06b6d4;animation:app-splash-slide 1.1s ease-in-out infinite}
    @keyframes app-splash-slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
    @media (prefers-color-scheme:dark){#app-splash{background:#09090b}#app-splash .app-splash-name{color:#67e8f9}}
  </style>
  </head>
  <body>
    <div id="app-splash">
      <img src="./icon-192.svg" alt="TempMail" />
      <div class="app-splash-name">TempMail</div>
      <div class="app-splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && !window.Capacitor) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js", { scope: "./" })
            .then(() => console.log("[SW] Registered"))
            .catch((err) => console.warn("[SW] Registration failed:", err));
        });
      }
    </script>
    <script>
      setTimeout(function(){if(!window.__appBooted){var s=document.getElementById("app-splash");if(s){s.classList.add("hide");setTimeout(function(){s.remove()},400)}}},8000);
    </script>
  </body>
</html>
