<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TempMail — Email Sementara Gratis</title>
    <meta name="description" content="Buat alamat email sementara instan tanpa registrasi. Privasi terlindungi, gratis selamanya." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TempMail" />
    <link rel="apple-touch-icon" href="icon-192.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="TempMail — Email Sementara Gratis" />
    <meta property="og:description" content="Buat email sementara instan. Lindungi privasi Anda dari spam." />
    <meta property="og:type" content="website" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js", { scope: "./" })
            .then(() => console.log("[SW] Registered"))
            .catch((err) => console.warn("[SW] Registration failed:", err));
        });
      }
    </script>
  </body>
</html>
